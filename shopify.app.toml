name = "Reel2AICart - Shoppable Video to AI Cart"
handle = "reel2aicart"
client_id = "440af85bd85a43647ef6eb17285200b0"

[build]
dev_store_url = ""
include_config_on_deploy = true

[access_scopes]
# PRD §8 — minimal scopes for MVP Day 1-2
scopes = "read_products,read_inventory,read_content,write_content"

[auth]
redirect_urls = ["https://reel2-aicart.vercel.app/auth/callback", "https://reel2-aicart.vercel.app/auth/shopify/callback"]

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
topics = ["products/create", "products/update", "inventory_levels/update"]
uri = "https://reel2-aicart.vercel.app/webhooks/shopify"

[extensions]
# Theme App Extension — shoppable video widget (PRD §8, Phase 4)
type = "theme_app_extension"
